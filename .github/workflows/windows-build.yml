name: Build Windows EXE

on:
  push:
    branches:
      - master
    paths-ignore:
      - "src/dist/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          architecture: "x64"

      - name: Install offline dependencies
        shell: powershell
        run: ./src/tools/install_offline.ps1 -PythonCommand python

      - name: Run tests
        shell: powershell
        working-directory: src
        run: ./.venv/Scripts/python.exe -m pytest tests -q

      - name: Build executable
        shell: powershell
        run: ./src/build_exe.ps1

      - name: Smoke-test executable startup
        shell: powershell
        run: |
          $versionText = Get-Content ./src/gem300_log_analyzer/__init__.py -Raw
          if ($versionText -notmatch '__version__\s*=\s*"([^"]+)"') {
            throw "Could not read application version"
          }
          $exe = Get-Item "./src/dist/GEM300_Log_Analyzer_v$($Matches[1]).exe"
          $marker = Join-Path $env:RUNNER_TEMP "gem300-startup-ok.txt"
          $errorMarker = "$marker.error"
          $env:GEM300_STARTUP_SMOKE_MARKER = $marker
          $process = Start-Process -FilePath $exe.FullName -PassThru
          $deadline = (Get-Date).AddSeconds(30)
          while (-not (Test-Path -LiteralPath $marker) -and -not (Test-Path -LiteralPath $errorMarker) -and -not $process.HasExited -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 250
            $process.Refresh()
          }
          if (Test-Path -LiteralPath $errorMarker) {
            if (-not $process.HasExited) {
              taskkill /PID $process.Id /T /F | Out-Null
            }
            throw "Built executable startup failed:`n$(Get-Content -LiteralPath $errorMarker -Raw)"
          }
          if (-not (Test-Path -LiteralPath $marker)) {
            if (-not $process.HasExited) {
              taskkill /PID $process.Id /T /F | Out-Null
            }
            throw "Built executable did not complete the startup smoke test."
          }
          if (-not $process.WaitForExit(10000)) {
            taskkill /PID $process.Id /T /F | Out-Null
            throw "Built executable did not exit after the startup smoke test."
          }
          if ($process.ExitCode -ne 0) {
            throw "Built executable exited with code $($process.ExitCode)."
          }
          Write-Host "Executable startup smoke test passed: $(Get-Content -LiteralPath $marker -Raw)"

      - name: Commit executable
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f src/dist
          if (-not (git diff --cached --quiet)) {
            $versionText = Get-Content ./src/gem300_log_analyzer/__init__.py -Raw
            if ($versionText -notmatch '__version__\s*=\s*"([^"]+)"') {
              throw "Could not read application version"
            }
            git commit -m "Build v$($Matches[1]) executable [skip ci]"
            git push
          }
