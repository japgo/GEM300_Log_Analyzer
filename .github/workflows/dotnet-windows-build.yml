name: Build CSharp Avalonia Windows

on:
  push:
    branches: [master]
    paths:
      - 'dotnet/**'
      - 'src/gem300_log_analyzer/__init__.py'
      - '.github/workflows/dotnet-windows-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check parsing, indexing and lazy annotations
        working-directory: dotnet
        run: dotnet run --project Gem300.Checks -c Release
      - name: Publish self-contained application
        working-directory: dotnet
        run: dotnet publish Gem300.Desktop -c Release -r win-x64 --self-contained true -o artifacts/windows
      - name: Smoke-test published application
        shell: pwsh
        run: |
          $env:GEM300_CACHE_DIR = Join-Path $env:RUNNER_TEMP 'gem300-dotnet-smoke'
          $exe = Get-ChildItem './dotnet/artifacts/windows/GEM300_Log_Analyzer_v*.exe' | Select-Object -First 1
          $process = Start-Process -FilePath $exe.FullName -ArgumentList '--smoke' -PassThru
          if (-not $process.WaitForExit(60000)) {
            Stop-Process -Id $process.Id -Force
            throw 'Avalonia startup/UI smoke test timed out.'
          }
          if ($process.ExitCode -ne 0) { throw "Avalonia smoke test failed: $($process.ExitCode)" }
      - name: Zip application and dependencies
        shell: pwsh
        run: |
          $version = (dotnet msbuild ./dotnet/Gem300.Desktop/Gem300.Desktop.csproj -getProperty:Version).Trim()
          $zip = "GEM300_Log_Analyzer_v${version}_win-x64.zip"
          Compress-Archive -Path './dotnet/artifacts/windows/*' -DestinationPath "./dotnet/artifacts/$zip"
          "GEM300_VERSION=$version" >> $env:GITHUB_ENV
          "GEM300_ZIP=./dotnet/artifacts/$zip" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: GEM300-Windows-ZIP
          path: dotnet/artifacts/*.zip
      - name: Publish ZIP release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:GEM300_VERSION"
          $ErrorActionPreference = 'Continue'
          gh release view $tag --json tagName 2>$null | Out-Null
          $releaseExists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = 'Stop'
          if (-not $releaseExists) {
            $releaseArgs = @('release', 'create', $tag, '--target', $env:GITHUB_SHA,
              '--title', "GEM300 Log Analyzer $tag", '--notes-file', './dotnet/RELEASE_NOTES.md')
            if ($env:GEM300_VERSION.Contains('-')) { $releaseArgs += '--prerelease' }
            & gh @releaseArgs
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          }
          gh release upload $tag $env:GEM300_ZIP --clobber
          if ($LASTEXITCODE -ne 0) { throw 'ZIP upload failed.' }
